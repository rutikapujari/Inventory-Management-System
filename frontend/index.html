<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const syncManagerMenu = () => {
          const isManagerPage = window.location.pathname.startsWith("/manager");
          const isAuthPage = ["/login", "/register", "/forgot-password"].some((path) =>
            window.location.pathname.startsWith(path)
          );
          const isUnauthorizedPage = window.location.pathname.startsWith("/admin/unauthorized");
          let button = document.querySelector("[data-manager-menu-button]");

          document.body.classList.toggle("auth-page", isAuthPage);
          document.body.classList.toggle("unauthorized-page", isUnauthorizedPage);

          document.body.classList.toggle("manager-page", isManagerPage);

          if (!isManagerPage) {
            document.querySelectorAll("[data-manager-menu-button]").forEach((menuButton) => {
              menuButton.remove();
            });
            document.body.classList.remove("manager-sidebar-open");
            return;
          }

          document.querySelectorAll("[data-manager-menu-button]").forEach((menuButton) => {
            menuButton.remove();
          });
        };

        syncManagerMenu();
        window.addEventListener("popstate", syncManagerMenu);
        const pushState = history.pushState;
        history.pushState = function (...args) {
          pushState.apply(this, args);
          setTimeout(syncManagerMenu, 0);
        };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
